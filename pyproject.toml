[project]
name = "tools"
version = "0"
description = "Build scripts and tests for tools.michaelwarkentin.com"
requires-python = ">=3.12"
dependencies = ["markdown"]

[dependency-groups]
dev = ["pytest", "pytest-playwright"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
